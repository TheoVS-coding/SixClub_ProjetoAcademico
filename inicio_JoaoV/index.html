<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Loja de Tênis</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <header class="header">
        <section>

            <div class="logo">
                <a href="#">
                    <img width="90" height="45" src="imagens/logoprojeto.png" alt="logo">
                </a>
            </div>

            <nav class="navbar">
                <a href="#home" class="a1">home</a>
                <a href="#about">sobre</a>
                <a href="#menu">menu</a>
                <a href="#review">avaliações</a>
                <a href="#address">endereço</a>
            </nav>

            <div class="icons">

                <a href="#"><img width="30" height="30" src="https://img.icons8.com/ios-filled/50/FFFFFF/search--v1.png"
                        alt="navbar" /></a>

                <a href="#"><img width="30" height="30" src="../img/carrinho.png" alt="carrinho" /></a>

                <a href="#"><img width="30" height="30" src="imagens/user.png" alt="user" /></a>

            </div>


        </section>
    </header>

    <div id="bannerSlide" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicadores -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#bannerSlide" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#bannerSlide" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#bannerSlide" data-bs-slide-to="2"></button>
        </div>

        <!-- Slides -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="imagens/tenis 1.jpg" alt="Slide 1">
            </div>

            <div class="carousel-item">
                <img src="imagens/tenis 2.jpg" alt="Slide 2">
            </div>

            <div class="carousel-item">
                <img src="imagens/tenis 3.jpg" alt="Slide 3">
            </div>
        </div>

        <!-- Controles -->
        <button class="carousel-control-prev" type="button" data-bs-target="#bannerSlide" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#bannerSlide" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
